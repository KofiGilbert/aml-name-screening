[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aml-name-screening"
version = "0.1.0"
description = "Sanctions and PEP name screening with fuzzy matching and an auditable review queue"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kofi Gilbert"}]
keywords = ["aml", "kyc", "sanctions", "ofac", "screening", "compliance"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
screen = "screening.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
